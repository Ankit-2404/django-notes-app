apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notes-app-db-data
  namespace: notes-app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: notes-app-db
  namespace: notes-app
spec:
  selector:
    app: notes-app-db
  ports:
    - name: mysql
      protocol: TCP
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app-db
  namespace: notes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-app-db
  template:
    metadata:
      labels:
        app: notes-app-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: notes-app-db-credentials
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: notes-app-db-credentials
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notes-app-db-credentials
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notes-app-db-credentials
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: database-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: database-data
          persistentVolumeClaim:
            claimName: notes-app-db-data
